#    application
#    cloud_console
#    guided_doc
#    presentation
#    video
type: guided_doc


# The name of the demo.
title: Dataform Demo Project


# A short description of the demo.
thumbnail_summary: A simple ELT pipeline demonstrating Medallion architecture (Bronze, Silver, Gold layers) using Dataform and BigQuery.


# A summary of the demo's intention. Markdown supported.
purpose: This project demonstrates how to build and orchestrate an ELT pipeline in Google Cloud using Dataform and BigQuery Public Datasets (Austin 311 service requests). It showcases a Medallion architecture spanning multiple GCP projects for Bronze, Silver, and Gold layers, provisioned with Terraform and executable via the Dataform UI or a REST API CI/CD simulator.


# A summary of the demo's business value. Markdown supported.
business_value: Enables organizations to implement scalable, maintainable, and governed data transformation pipelines. By separating data into structured Medallion layers across isolated GCP projects, businesses can improve data quality, streamline compliance, and accelerate time-to-insight for analytics in BigQuery.


# A summary of the demo's technical value. Markdown supported.
technical_value: Showcases Dataform SQLX definitions, multi-project data modeling (Bronze raw ingestion, Silver cleansing/enrichment, Gold aggregation), infrastructure-as-code deployment via Terraform, Secret Manager integration for Git SSH deploy keys, and programmatic compilation and execution via the Dataform REST API.




